[package]
name = "armature-jwt"
version = "0.2.1"
edition = "2024"
rust-version = "1.94.1"
autobenches = false  # Disable auto-discovery, use explicit [[bench]] only
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-jwt"
homepage = "https://quinnjr.github.io/armature"
description = "JWT token handling for Armature authentication"
keywords = ["jwt", "token", "authentication", "security"]
categories = ["authentication", "web-programming"]

[dependencies]
armature-core = { version = "0" }
armature-log = { version = "0" }
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"

# Explicit bench targets only: a stray file under benches/ should not silently
# become a target.
[[bench]]
name = "jwt"
harness = false
